name: Native iPhone launch check
on:
  push:
    branches: [feature/native-sync-preview]
    paths: ['.github/workflows/native-preview-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-preview:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app
        working-directory: apple
        run: >-
          xcodebuild -quiet -project Daynote.xcodeproj -scheme Daynote -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Visual
          CODE_SIGNING_ALLOWED=NO build
      - name: Launch app and capture native iPhone screen
        working-directory: apple
        run: |
          xcrun simctl list devices available -j > /tmp/daynote-devices.json
          device_id=$(python3 -c 'import json; d=json.load(open("/tmp/daynote-devices.json")); p=[x for rows in d["devices"].values() for x in rows if x.get("isAvailable") and "iPhone" in x["name"]]; p.sort(key=lambda x: ("iPhone 17" not in x["name"], x["name"])); print(p[0]["udid"])')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl status_bar "$device_id" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$device_id" 'build/Visual/Build/Products/Debug-iphonesimulator/朝夕日历.app'
          xcrun simctl launch "$device_id" app.youmu.daynote.native
          sleep 8
          mkdir -p preview
          xcrun simctl io "$device_id" screenshot preview/iPhone-native.png
          xcrun simctl terminate "$device_id" app.youmu.daynote.native
          xcrun simctl shutdown "$device_id"
      - uses: actions/upload-artifact@v4
        with:
          name: Daynote-iPhone-Native-Preview
          path: apple/preview/iPhone-native.png
          retention-days: 7
          if-no-files-found: error
