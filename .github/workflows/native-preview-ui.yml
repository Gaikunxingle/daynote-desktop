name: Native iPhone launch check
on:
  push:
    branches: [feature/native-sync-preview]
    paths: ['.github/workflows/native-preview-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-preview:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app
        working-directory: apple
        run: >-
          xcodebuild -quiet -project Daynote.xcodeproj -scheme Daynote -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Visual
          CODE_SIGNING_ALLOWED=NO build
      - name: Launch app and capture native iPhone screen
        working-directory: apple
        run: |
          set -euo pipefail
          mkdir -p preview
          xcrun simctl list devices available -j > /tmp/daynote-devices.json
          device_id=$(python3 -c 'import json; d=json.load(open("/tmp/daynote-devices.json")); p=[x for rows in d["devices"].values() for x in rows if x.get("isAvailable") and "iPhone" in x["name"]]; p.sort(key=lambda x: ("iPhone 17" not in x["name"], x["name"])); print(p[0]["udid"])')
          trap 'xcrun simctl io "$device_id" screenshot preview/iPhone-at-exit.png >/dev/null 2>&1 || true; xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl status_bar "$device_id" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$device_id" 'build/Visual/Build/Products/Debug-iphonesimulator/朝夕日历.app'
          xcrun simctl launch "$device_id" app.youmu.daynote.native 2>&1 | tee preview/unsigned-launch.log
          sleep 8
          xcrun simctl io "$device_id" screenshot preview/iPhone-native-unsigned-fallback.png
          xcrun simctl terminate "$device_id" app.youmu.daynote.native
          # Let Xcode produce the simulator signature and entitlements. Never invent
          # application identities or Keychain groups; real devices use Personal Team.
          xcodebuild -quiet -project Daynote.xcodeproj -scheme Daynote -configuration Debug \
            -destination "id=$device_id" -derivedDataPath build/VisualSigned \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM= build \
            2>&1 | tee preview/signed-build.log
          xcrun simctl uninstall "$device_id" app.youmu.daynote.native
          xcrun simctl install "$device_id" 'build/VisualSigned/Build/Products/Debug-iphonesimulator/朝夕日历.app'
          xcrun simctl launch "$device_id" app.youmu.daynote.native 2>&1 | tee preview/signed-launch.log
          sleep 8
          xcrun simctl io "$device_id" screenshot preview/iPhone-native.png
          xcrun simctl terminate "$device_id" app.youmu.daynote.native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Daynote-iPhone-Native-Preview
          path: apple/preview/
          retention-days: 7
          if-no-files-found: warn
